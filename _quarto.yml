# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Joshua Dantus"                                # Your name
  description: ""   # A brief slogan (optional)
  image: img/profile.png
  
  favicon: img/Favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/Favicon.png
    
    # your sub-pages
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about/index.qmd
      - text: "Experience"
        href: experience/index.qmd
      - text: "Resume"
        href: resume/index.qmd
    
    # your social media handles
    right:
      - icon: envelope
        aria-label: email
        href: "jjd152@case.edu"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      
    center: |
      
    right: | 
      
      
project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true